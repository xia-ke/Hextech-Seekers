name: Unity Editor on Windows self-hosted (Personal)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-windows-selfhosted.yml'
      - 'native-unity/**'
permissions:
  contents: read
concurrency:
  group: hextech-native-windows-editor
  cancel-in-progress: true
jobs:
  editor:
    # Register a Windows runner with the extra label hextech-unity.
    runs-on: [self-hosted, Windows, X64, hextech-unity]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Enable Git long paths for Unity package cache
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Find local Unity Editor (no cloud license import)
        id: unity
        run: |
          $version = '6000.0.40f1'
          $candidates = @()
          if ($env:UNITY_EDITOR_PATH) { $candidates += $env:UNITY_EDITOR_PATH }
          Write-Host "Runner account: $env:USERNAME; workdir: $env:GITHUB_WORKSPACE"
          Write-Host "Configured UNITY_EDITOR_PATH: $env:UNITY_EDITOR_PATH"
          $candidates += 'F:\6000.6.7f1\Editor\Unity.exe'
          $candidates += "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe"
          $unity = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $unity) { throw "Unity Editor not found. Checked: $($candidates -join '; '). Install Unity or set UNITY_EDITOR_PATH in the runner environment." }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exe=$unity" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Found Unity Editor: $unity"
          if ($unity -like "*6000.6.7f1*") { Write-Warning "Project version is 6000.0.40f1; running 6000.6.7f1 compatibility validation." }
      - name: Prepare verified original assets
        run: |
          $python = Get-Command py -ErrorAction SilentlyContinue
          if ($python) {
            & py -3 native-unity/tools/prepare_assets.py
          } else {
            & python native-unity/tools/prepare_assets.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Original asset preparation failed: $LASTEXITCODE" }
      - name: Run Unity Editor compile and EditMode tests
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hextech-unity-evidence'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $log = Join-Path $out 'Editor.log'
          $results = Join-Path $out 'editmode-results.xml'
          $unity = "${{ steps.unity.outputs.exe }}"
          # Unity.exe is a Windows GUI executable. PowerShell's '&' may return
          # before the Editor finishes. Wait for the process tree explicitly.
          $unityArgs = @(
            '-batchmode', '-nographics', '-quit',
            '-projectPath', ('"{0}"' -f $project),
            '-runTests', '-testPlatform', 'EditMode',
            '-testResults', ('"{0}"' -f $results),
            '-logFile', ('"{0}"' -f $log),
            '-accept-apiupdate'
          )
          Write-Host "Launching Unity Editor (synchronous wait): $unity"
          $proc = Start-Process -FilePath $unity -ArgumentList $unityArgs -Wait -PassThru
          $code = $proc.ExitCode
          Write-Host "Unity process finished with exit code: $code"
          if (Test-Path -LiteralPath $log) {
            Write-Host '=== Unity Editor.log last 180 lines ==='
            Get-Content -LiteralPath $log -Tail 180
          } else {
            Write-Warning "Unity did not produce Editor.log. Check for GUI startup, licensing, and project-lock errors."
          }
          if ($code -ne 0) { throw "Unity Editor exited with code $code; inspect Editor.log artifact" }
          if (-not (Test-Path -LiteralPath $results)) { throw "Unity process finished but EditMode XML is missing; inspect Editor.log artifact" }
          [xml]$xml = Get-Content -LiteralPath $results -Raw
          $root = $xml.'test-run'
          if ($root -and ([int]$root.failed -gt 0 -or [int]$root.errors -gt 0)) { throw "EditMode tests failed; inspect editmode-results.xml" }
      - name: Upload Editor logs and tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-windows-editor-evidence
          path: ${{ runner.temp }}/hextech-unity-evidence/
          if-no-files-found: warn
