name: Unity Editor on Windows self-hosted (Personal)
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - '.github/workflows/unity-windows-selfhosted.yml'
      - 'native-unity/**'
permissions:
  contents: read
concurrency:
  # Independent refs queue on the same runner rather than cancelling each other.
  group: hextech-native-windows-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    # Register a Windows runner with the extra label hextech-unity.
    runs-on: [self-hosted, Windows, X64, hextech-unity]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Enable Git long paths for Unity package cache
        run: git config --global core.longpaths true
      - name: Fetch exact source commit with Git (no codeload Actions)
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $workspace '.git'))) {
            & git -C $workspace init
            if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize repository in runner workspace' }
          }
          & git -C $workspace remote remove origin 2>$null
          & git -C $workspace remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git source remote' }
          $fetched = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & git -C $workspace -c core.longpaths=true fetch --no-tags --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            Write-Warning "Git fetch attempt $attempt failed"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $fetched) {
            # Windows Git/OpenSSL can fail TLS negotiation even when the
            # exact commit is reachable. Never disable certificate checks.
            Write-Warning 'OpenSSL Git fetch failed; retrying with Windows Schannel TLS'
            & git -C $workspace -c core.longpaths=true -c http.sslBackend=schannel fetch --no-tags --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) { $fetched = $true }
          }
          if (-not $fetched) {
            # A prior GPU job on the same self-hosted runner may have fetched
            # this commit already. Reuse it only when the EXACT Git commit
            # object for GITHUB_SHA exists locally; no stale-branch fallback.
            & git -C $workspace cat-file -e "$($env:GITHUB_SHA)^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Warning 'Network unavailable; using locally cached exact GITHUB_SHA commit'
              $fetched = $true
            }
          }
          if (-not $fetched) { throw "Cannot fetch or verify exact commit $env:GITHUB_SHA" }
          & git -C $workspace -c core.longpaths=true reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reset workspace to exact requested commit' }
          & git -C $workspace -c core.longpaths=true clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'Cannot clean previous Unity files in workspace' }
          $actual = (& git -C $workspace rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Wrong checkout revision: $actual" }
          Write-Host "Exact project commit checked out: $actual"
      - name: Find local Unity Editor (no cloud license import)
        id: unity
        run: |
          $version = '6000.0.40f1'
          $candidates = @()
          if ($env:UNITY_EDITOR_PATH) { $candidates += $env:UNITY_EDITOR_PATH }
          Write-Host "Runner account: $env:USERNAME; workdir: $env:GITHUB_WORKSPACE"
          Write-Host "Configured UNITY_EDITOR_PATH: $env:UNITY_EDITOR_PATH"
          $candidates += 'F:\6000.6.7f1\Editor\Unity.exe'
          $candidates += "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe"
          $unity = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $unity) { throw "Unity Editor not found. Checked: $($candidates -join '; '). Install Unity or set UNITY_EDITOR_PATH in the runner environment." }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exe=$unity" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Found Unity Editor: $unity"
          if ($unity -like "*6000.6.7f1*") { Write-Warning "Project version is 6000.0.40f1; running 6000.6.7f1 compatibility validation." }
      - name: Prepare verified original assets
        run: |
          $python = Get-Command py -ErrorAction SilentlyContinue
          if ($python) {
            & py -3 native-unity/tools/prepare_assets.py
          } else {
            & python native-unity/tools/prepare_assets.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Original asset preparation failed: $LASTEXITCODE" }
      - name: Stage optional imported champion assets (offline, hash-verified)
        env:
          HEXTECH_CHAMPION_ASSET_ROOT: ${{ vars.HEXTECH_CHAMPION_ASSET_ROOT }}
        run: |
          $sourceRoot = if ($env:HEXTECH_CHAMPION_ASSET_ROOT) {
            $env:HEXTECH_CHAMPION_ASSET_ROOT
          } else {
            'F:\\actions-runner\\HextechChampionSources'
          }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 native-unity/tools/stage_native_champions.py --source-root $sourceRoot
          } else {
            & python native-unity/tools/stage_native_champions.py --source-root $sourceRoot
          }
          if ($LASTEXITCODE -ne 0) { throw "Original optional champion staging failed ($LASTEXITCODE)" }
      - name: Run Unity Editor compile and EditMode tests
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hextech-unity-evidence'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $log = Join-Path $out 'Editor.log'
          $results = Join-Path $out 'editmode-results.xml'
          $unity = "${{ steps.unity.outputs.exe }}"
          # Unity.exe is a Windows GUI executable. PowerShell's '&' may return
          # before the Editor finishes. Wait for the process tree explicitly.
          $unityArgs = @(
            '-batchmode', '-nographics',
            '-projectPath', ('"{0}"' -f $project),
            '-runTests', '-testPlatform', 'EditMode',
            '-testResults', ('"{0}"' -f $results),
            '-logFile', ('"{0}"' -f $log),
            '-accept-apiupdate'
          )
          Write-Host "Launching Unity Editor (synchronous wait): $unity"
          $proc = Start-Process -FilePath $unity -ArgumentList $unityArgs -Wait -PassThru
          $code = $proc.ExitCode
          Write-Host "Unity process finished with exit code: $code"
          if (Test-Path -LiteralPath $log) {
            Write-Host '=== Unity Editor.log last 180 lines ==='
            Get-Content -LiteralPath $log -Tail 180
          } else {
            Write-Warning "Unity did not produce Editor.log. Check for GUI startup, licensing, and project-lock errors."
          }
          if ($code -ne 0) { throw "Unity Editor exited with code $code; inspect Editor.log artifact" }
          if (-not (Test-Path -LiteralPath $results)) { throw "Unity process finished but EditMode XML is missing; inspect Editor.log artifact" }
          [xml]$xml = Get-Content -LiteralPath $results -Raw
          $root = $xml.'test-run'
          if (-not $root) { throw "Invalid EditMode XML: NUnit test-run root missing" }
          Write-Host "EditMode total=$($root.total) passed=$($root.passed) failed=$($root.failed)"
          if ([int]$root.total -lt 1) { throw "EditMode run reported zero tests; refuse false success" }
          if ([int]$root.failed -gt 0 -or [int]$root.errors -gt 0) { throw "EditMode tests failed; inspect editmode-results.xml" }
      - name: Preserve Editor logs and tests on the Windows runner
        if: always()
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'hextech-unity-evidence'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            Write-Warning 'No Unity Editor evidence directory was created.'
            exit 0
          }
          $target = Join-Path 'F:\actions-runner\HextechEditorEvidence' $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force
          Write-Host "UNITY_EDITOR_EVIDENCE_DIR=$target"
          Get-ChildItem -LiteralPath $target -File -Recurse |
            ForEach-Object { Write-Host ("UNITY_EDITOR_EVIDENCE_FILE=" + $_.FullName + " bytes=" + $_.Length) }
