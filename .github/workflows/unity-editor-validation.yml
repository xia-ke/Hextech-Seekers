name: Unity Editor compile and tests (license required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original files and prepare the Unity project's StreamingAssets
        run: python native-unity/tools/prepare_assets.py
      - name: Verify Unity license is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Unity license not configured. Set UNITY_LICENSE or UNITY_SERIAL in repository Actions secrets."
            exit 1
          fi
      - uses: game-ci/unity-test-runner@v4
        id: unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: native-unity
          unityVersion: auto
          testMode: editmode
          artifactsPath: native-unity-editor-evidence
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editor-build-and-editmode-results
          path: native-unity-editor-evidence
