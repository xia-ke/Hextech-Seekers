name: Unity Windows Player real GPU visual acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - '.github/workflows/unity-windows-visual.yml'
      - 'native-unity/**'

permissions:
  contents: read

concurrency:
  # Prevent feature-branch pushes from cancelling main GPU validation.
  group: hextech-native-windows-gpu-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-visual:
    runs-on: [self-hosted, Windows, X64, hextech-unity]
    timeout-minutes: 100
    defaults:
      run:
        shell: powershell
    steps:
      - name: Enable long paths before checkout
        run: git config --global core.longpaths true

      - name: Fetch exact source commit with Git (no codeload Actions)
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $workspace '.git'))) {
            & git -C $workspace init
            if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize repository in runner workspace' }
          }
          & git -C $workspace remote remove origin 2>$null
          & git -C $workspace remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git source remote' }
          $fetched = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & git -C $workspace -c core.longpaths=true fetch --no-tags --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            Write-Warning "Git fetch attempt $attempt failed"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $fetched) { throw "Cannot fetch $env:GITHUB_SHA from repository" }
          & git -C $workspace -c core.longpaths=true reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reset workspace to exact requested commit' }
          & git -C $workspace -c core.longpaths=true clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'Cannot clean previous Unity files in workspace' }
          $actual = (& git -C $workspace rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Wrong checkout revision: $actual" }
          Write-Host "Exact project commit checked out: $actual"


      - name: Locate licensed Unity Editor
        id: unity
        run: |
          $candidates = @()
          if ($env:UNITY_EDITOR_PATH) { $candidates += $env:UNITY_EDITOR_PATH }
          $candidates += 'F:\6000.6.7f1\Editor\Unity.exe'
          $candidates += 'C:\Program Files\Unity\Hub\Editor\6000.0.40f1\Editor\Unity.exe'
          $unity = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $unity) { throw "Cannot find local licensed Unity.exe. Checked: $($candidates -join '; ')" }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exe=$unity" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Using Unity: $unity; Runner desktop user: $env:USERNAME"

      - name: Select Unity license activation method
        run: |
          Write-Host 'Default: reuse the Windows Runner account Unity Hub license.'
          Write-Host 'For Unity Personal, sign in to Unity Hub as the same Windows account that runs this Runner.'
          Write-Host 'Manual ULF activation is only for eligible paid or legacy licenses and is opt-in through UNITY_ACTIVATE_FROM_SECRET=true.'
      - name: Activate supported paid or legacy ULF license (opt-in only)
        if: ${{ vars.UNITY_ACTIVATE_FROM_SECRET == 'true' }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
            throw 'UNITY_LICENSE secret is empty. Refresh the Unity license secret before building a Windows Player.'
          }
          $licenseText = $env:UNITY_LICENSE.Trim()
          if (-not $licenseText.StartsWith('<?xml') -and -not $licenseText.StartsWith('<root')) {
            try {
              $compact = $licenseText -replace '\s', ''
              $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($compact))
              if ($decoded.Contains('<License') -or $decoded.Contains('<root')) {
                $licenseText = $decoded
              }
            } catch {
              throw 'UNITY_LICENSE is neither raw ULF XML nor valid base64-encoded ULF XML.'
            }
          }
          if (-not ($licenseText.Contains('<License') -or $licenseText.Contains('<root'))) {
            throw 'UNITY_LICENSE does not contain a Unity ULF license document.'
          }

          $licenseFile = Join-Path $env:RUNNER_TEMP 'Hextech_Unity_lic.ulf'
          $licenseLog = Join-Path $env:RUNNER_TEMP 'Hextech_Unity_license_activation.log'
          [System.IO.File]::WriteAllText(
            $licenseFile,
            $licenseText,
            (New-Object System.Text.UTF8Encoding($false))
          )
          try {
            $unity = '${{ steps.unity.outputs.exe }}'
            $arguments = @(
              '-batchmode',
              '-quit',
              '-manualLicenseFile',
              ('"{0}"' -f $licenseFile),
              '-logFile',
              ('"{0}"' -f $licenseLog)
            )
            $proc = Start-Process -FilePath $unity -ArgumentList $arguments -Wait -PassThru
            Write-Host "Unity manual license activation exit=$($proc.ExitCode)"
            if (Test-Path -LiteralPath $licenseLog -PathType Leaf) {
              Get-Content -LiteralPath $licenseLog -Tail 80 | ForEach-Object { Write-Host $_ }
              $licenseLogText = Get-Content -LiteralPath $licenseLog -Raw
              if ($licenseLogText -match 'TimeStamp validation failed|No ULF license found|License activation failed|Unable to update licenses') {
                throw 'Unity rejected UNITY_LICENSE. Refresh the ULF from Unity Hub on this Windows GPU runner and replace the GitHub Actions secret.'
              }
            }
            if ($proc.ExitCode -ne 0) {
              throw "Unity license activation failed (exit $($proc.ExitCode)); see $licenseLog"
            }
          } finally {
            if (Test-Path -LiteralPath $licenseFile) {
              Remove-Item -LiteralPath $licenseFile -Force
            }
          }

      - name: Prepare and verify original Rift and Garen assets
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 native-unity/tools/prepare_assets.py
          } else {
            & python native-unity/tools/prepare_assets.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Pinned original asset preparation failed ($LASTEXITCODE)" }

      - name: Stage optional provenance-verified original hero rigs from persistent runner storage
        env:
          HEXTECH_CHAMPION_ASSET_ROOT: ${{ vars.HEXTECH_CHAMPION_ASSET_ROOT }}
        run: |
          # Never fetch or commit copyrighted champion art. Keep the source
          # outside the Git workspace: checkout uses git clean -ffdx.
          $sourceRoot = if ($env:HEXTECH_CHAMPION_ASSET_ROOT) {
            $env:HEXTECH_CHAMPION_ASSET_ROOT
          } else {
            'F:\\actions-runner\\HextechChampionSources'
          }
          Write-Host 'Checking locally imported champion sources (optional; Garen baseline remains available)'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 native-unity/tools/stage_native_champions.py --source-root $sourceRoot
          } else {
            & python native-unity/tools/stage_native_champions.py --source-root $sourceRoot
          }
          if ($LASTEXITCODE -ne 0) { throw "Original optional champion staging failed ($LASTEXITCODE)" }

      - name: Convert pinned Rift WebP textures into PNG-compatible GLB
        run: |
          # Unity is not the first GUI application encountered on Windows:
          # explicitly wait for Python and retain stdout/stderr for failure analysis.
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $stdout = Join-Path $root 'MapConversion.stdout.log'
          $stderr = Join-Path $root 'MapConversion.stderr.log'
          $pyCommand = Get-Command py -ErrorAction SilentlyContinue
          if ($pyCommand) {
            $pyExe = $pyCommand.Source
            $prefix = @('-3')
          } else {
            $pyCommand = Get-Command python -ErrorAction Stop
            $pyExe = $pyCommand.Source
            $prefix = @()
          }
          Write-Host "Python launcher: $pyExe"
          function RunPython([string[]] $argsList, [string] $description) {
            if (Test-Path $stdout) { Remove-Item $stdout -Force }
            if (Test-Path $stderr) { Remove-Item $stderr -Force }
            $proc = Start-Process -FilePath $pyExe -ArgumentList ($prefix + $argsList) -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Write-Host "$description exit=$($proc.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout -Tail 80 | ForEach-Object { Write-Host $_ } }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 80 | ForEach-Object { Write-Host $_ } }
            return $proc.ExitCode
          }
          $setupScript = Join-Path $env:GITHUB_WORKSPACE 'native-unity\tools\ensure_pillow.py'
          $code = RunPython @(('"{0}"' -f $setupScript)) 'Verified offline Pillow setup'
          if ($code -ne 0) { throw "Pillow wheel setup failed ($code), inspect MapConversion.stderr.log" }
          $rift = Join-Path $env:GITHUB_WORKSPACE 'native-unity\Assets\StreamingAssets\Rift'
          $source = Join-Path $rift 'map.glb'
          $output = Join-Path $rift 'map-unity.glb'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Original pinned map.glb missing after preparation' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'native-unity\tools\convert_webp_glb.py'
          $arguments = @(
            ('"{0}"' -f $script),
            ('"{0}"' -f $source),
            ('"{0}"' -f $output),
            '--sha256', 'bdabbf3eb0c37dd2bb8567035c018d0da0f79c849c9353e5192a58279369a69e'
          )
          $code = RunPython $arguments 'Pinned Rift WebP-to-PNG conversion'
          if ($code -ne 0) { throw "Pinned Rift WebP-to-PNG conversion failed ($code), see MapConversion.stderr.log" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Python finished successfully but converted map-unity.glb missing; see conversion stdout/stderr' }
          $meta = Join-Path $rift 'map-unity.conversion.json'
          if (-not (Test-Path -LiteralPath $meta -PathType Leaf)) { throw 'Converted GLB exists but conversion metadata missing' }
          Copy-Item -LiteralPath $meta -Destination (Join-Path $root 'map-conversion.json')
          $conversion = Get-Content -LiteralPath $meta -Raw | ConvertFrom-Json
          if (-not $conversion.alphaAudit) { throw 'Alpha audit missing from GLB conversion metadata' }
          $audit = $conversion.alphaAudit
          Write-Host ("NATIVE_GLB_ALPHA_AUDIT: imagesWithTransparency={0} materialsWithAlpha={1} opaqueWithAlpha={2}" -f $audit.imagesWithTransparency, $audit.baseColorMaterialsUsingTransparentImages, $audit.opaqueModeWithTransparentBaseColor)
          foreach ($material in @($audit.materials)) {
            if ($material.alphaMode -eq 'OPAQUE' -and $material.name -match '(?i)leaf|leaves|foliage|grass|tree|bush|plant|shrub') {
              Write-Warning ("OPAQUE_FOLIAGE_ALPHA: index={0} name={1} transparentPixels={2}" -f $material.materialIndex, $material.name, $material.transparentPixels)
            }
          }
          Write-Host "Converted Unity-compatible GLB size: $((Get-Item $output).Length) bytes"

      - name: Stage SHA-verified original Blue Sentinel art and idle clip (not in Git)
        run: |
          $cacheRoot = 'F:\actions-runner\HextechNeutralSources'
          Write-Host 'Retrieving pinned original blue sentinel model: SHA256 + skin + idle verified'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 native-unity/tools/stage_original_neutral_art.py --cache-root $cacheRoot
          } else {
            & python native-unity/tools/stage_original_neutral_art.py --cache-root $cacheRoot
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned original blue sentinel art staging failed'
          }
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'native-unity\Assets\StreamingAssets\Neutrals\buff_blue.json'
          $model = Join-Path $env:GITHUB_WORKSPACE 'native-unity\Assets\StreamingAssets\Neutrals\buff_blue.glb'
          if (-not (Test-Path $receipt -PathType Leaf) -or -not (Test-Path $model -PathType Leaf)) {
            throw 'Verified original neutral GLB or receipt not staged'
          }
          $meta = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($meta.kind -ne 'buff_blue' -or $meta.sourceSha256 -ne
              '6d3181d21998e13783f0bd05ff571217b86714d0ec0f3bbaab424d5979fee1c9' -or
              $meta.idleClip -ne 'sru_blue_idle_normal' -or -not $meta.sourceVerified) {
            throw 'Pinned blue sentinel model verification receipt invalid'
          }
          Write-Host "NATIVE_BLUE_ORIGINAL_STAGED: bytes=$((Get-Item $model).Length) idle=$($meta.idleClip)"

      - name: Build real Windows x64 Player
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          # Preserve conversion logs and map-conversion.json for postmortem artifacts.
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $conversionReport = Join-Path $project 'Assets\StreamingAssets\Rift\map-unity.conversion.json'
          if (Test-Path -LiteralPath $conversionReport) { Copy-Item -LiteralPath $conversionReport -Destination (Join-Path $root 'map-conversion.json') }
          $log = Join-Path $root 'Build.log'
          $unity = "${{ steps.unity.outputs.exe }}"
          $args = @(
            '-batchmode', '-nographics', '-quit',
            '-projectPath', ('"{0}"' -f $project),
            '-executeMethod', 'HextechSeekers.Native.Editor.HextechNativeSetup.BuildWindows',
            '-logFile', ('"{0}"' -f $log),
            '-accept-apiupdate'
          )
          Write-Host 'Building original Rift/Garen Windows x64 Player with Unity Editor'
          # Start-Process -Wait hides all progress until Unity exits. Poll the
          # process and print a bounded tail of Build.log for diagnosis.
          $proc = Start-Process -FilePath $unity -ArgumentList $args -PassThru
          $started = Get-Date
          $timeoutMinutes = 75
          $pollSeconds = 30
          $lastLogSize = -1L
          $timedOut = $false
          try {
            while ($true) {
              $proc.Refresh()
              if ($proc.HasExited) { break }
              $elapsed = (Get-Date) - $started
              if ($elapsed.TotalMinutes -ge $timeoutMinutes) {
                $timedOut = $true
                Write-Error "Unity Player build timed out after $([int]$elapsed.TotalMinutes) min (PID $($proc.Id))." -ErrorAction Continue
                # Unity may spawn child import/compiler processes; terminate only
                # after the explicit build timeout, never on a healthy build.
                & taskkill /PID $proc.Id /T /F 2>&1 | ForEach-Object { Write-Host $_ }
                break
              }
              $bytes = -1L
              if (Test-Path -LiteralPath $log -PathType Leaf) {
                try {
                  $bytes = (Get-Item -LiteralPath $log -ErrorAction Stop).Length
                  if ($bytes -ne $lastLogSize) {
                    Get-Content -LiteralPath $log -Tail 8 -ErrorAction Stop |
                      ForEach-Object { Write-Host "UNITY_BUILD_LOG: $_" }
                  }
                } catch {
                  Write-Warning "Build.log temporarily unavailable: $($_.Exception.Message)"
                }
              }
              $lastLogSize = $bytes
              Write-Host ("UNITY_BUILD_HEARTBEAT: elapsedSeconds={0} pid={1} logBytes={2}" -f [int]$elapsed.TotalSeconds, $proc.Id, $bytes)
              Start-Sleep -Seconds $pollSeconds
            }
          } finally {
            $proc.Refresh()
            if ($proc.HasExited) { $proc.WaitForExit() }
          }
          if ($timedOut) { throw "Windows Player build exceeded $timeoutMinutes-minute process timeout; inspect Build.log" }
          Write-Host "Unity BuildWindows exit code: $($proc.ExitCode)"
          if (Test-Path -LiteralPath $log) {
            Write-Host '=== Build.log last 160 lines ==='
            Get-Content -LiteralPath $log -Tail 160
          } else { Write-Warning 'Unity Build.log missing' }
          if ($proc.ExitCode -ne 0) { throw "Windows Player build failed (exit $($proc.ExitCode))" }
          if (-not (Test-Path -LiteralPath $log -PathType Leaf) -or
              -not (Select-String -LiteralPath $log -SimpleMatch 'NATIVE_GLTF_SHADER_RESOURCES_READY' -Quiet) -or
              -not (Select-String -LiteralPath $log -SimpleMatch 'NATIVE_GLTF_ALPHA_VARIANTS_READY: mask=true blend=true' -Quiet)) {
            throw 'Build did not prove glTFast base, MASK and BLEND shader variants were pinned into Resources'
          }
          $exe = Join-Path $project 'Build\Windows\HextechSeekers.exe'
          $data = Join-Path $project 'Build\Windows\HextechSeekers_Data'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf) -or -not (Test-Path -LiteralPath $data -PathType Container)) {
            throw 'Unity exited 0 but Windows Player EXE/Data missing'
          }
          Write-Host "Windows Player built: $exe"
          Get-Item -LiteralPath $exe | Select-Object FullName, Length | Format-List

      - name: Run Windows Player on actual GPU and capture animations
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $exe = Join-Path $project 'Build\Windows\HextechSeekers.exe'
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $evidence = Join-Path $root 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $log = Join-Path $root 'Player.log'
          $args = @(
            '-force-d3d11',
            '-screen-fullscreen', '0',
            '-screen-width', '1280',
            '-screen-height', '720',
            '-logFile', ('"{0}"' -f $log),
            '-hextechVisualQA',
            '-hextechEvidenceDir', ('"{0}"' -f $evidence)
          )
          Write-Host "Launching actual Windows GPU Player on runner desktop: $exe"
          Write-Host ("Player command: " + $exe + " " + ($args -join ' '))
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -ArgumentList $args -PassThru
          Start-Sleep -Seconds 2
          $proc.Refresh()
          if (-not $proc.HasExited) {
            $processInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $($proc.Id)" -ErrorAction SilentlyContinue
            if ($processInfo) { Write-Host ("PLAYER_ACTUAL_COMMANDLINE=" + $processInfo.CommandLine) }
          } else {
            Write-Warning "Player exited during the first two seconds (code=$($proc.ExitCode))"
          }
          $finished = $proc.WaitForExit(420000)
          if (-not $finished) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Host '=== Player.log on timeout ==='
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 160 }
            throw 'GPU Player timed out after 7 minutes; verify interactive desktop session, GLB loading and logs'
          }
          Write-Host "Player exit code: $($proc.ExitCode)"
          if (Test-Path -LiteralPath $log) {
            Write-Host '=== Player.log last 120 lines ==='
            Get-Content -LiteralPath $log -Tail 120
          } else { Write-Warning 'Unity Player.log missing' }
          $qaResult = Join-Path $evidence 'result.json'
          if (Test-Path -LiteralPath $qaResult -PathType Leaf) {
            Write-Host '=== Player result.json ==='
            Get-Content -LiteralPath $qaResult | ForEach-Object { Write-Host $_ }
          } else {
            Write-Warning 'Player did not write result.json; inspect NATIVE_QA_* markers in Player.log'
          }
          if ($proc.ExitCode -ne 0) { throw "GPU Player exited with code $($proc.ExitCode); inspect Player.log, result.json, and archived evidence" }
          $playerLogText = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw } else { '' }
          foreach ($marker in @(
            'NATIVE_GLTF_SHADERS_PRELOADED',
            'NATIVE_GLTF_ALPHA_VARIANTS_PRELOADED',
            'NATIVE_MAP_ALPHA_MATERIAL_AUDIT',
            'NATIVE_MAP_MATERIAL_AUDIT_PASS',
            'NATIVE_UNITY_WATERMARK_AUDIT'
          )) {
            if (-not $playerLogText.Contains($marker)) {
              throw "Player did not confirm required 3D material check: $marker"
            }
          }
          if ($playerLogText -match "Shader 'Shader Graphs/glTF-(unlit|pbrMetallicRoughness)' is missing") {
            throw 'Player still reports a missing glTFast shader graph'
          }
          if (-not (Test-Path -LiteralPath $qaResult -PathType Leaf)) {
            throw 'Player exited without result.json after a zero exit code.'
          }

      - name: Verify real GPU PNGs and evidence without extra dependencies
        run: |
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $evidence = Join-Path $root 'evidence'
          $conversion = Join-Path $root 'map-conversion.json'
          if (-not (Test-Path -LiteralPath $conversion -PathType Leaf)) {
            throw 'map-conversion.json missing; cannot audit WebP alpha preservation and glTF material alphaMode'
          }
          Copy-Item -LiteralPath $conversion -Destination (Join-Path $evidence 'map-conversion.json') -Force
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 native-unity/tools/verify_visual_qa.py $evidence
          } else {
            & python native-unity/tools/verify_visual_qa.py $evidence
          }
          if ($LASTEXITCODE -ne 0) { throw "GPU screenshot verification failed ($LASTEXITCODE); inspect evidence artifact" }

      - name: Exercise native playable match in real Windows Player
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $exe = Join-Path $project 'Build\Windows\HextechSeekers.exe'
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $evidence = Join-Path $root 'evidence'
          $log = Join-Path $root 'Gameplay.log'
          $args = @(
            '-force-d3d11',
            '-screen-fullscreen', '0',
            '-screen-width', '1280',
            '-screen-height', '720',
            '-logFile', ('"{0}"' -f $log),
            '-hextechGameplayQA',
            '-hextechRequireOriginalBlueArt',
            '-hextechEvidenceDir', ('"{0}"' -f $evidence)
          )
          Write-Host 'Running a real GPU Player gameplay smoke: both roles, 120s preparation, capture and scores'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(240000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native gameplay smoke timed out after 4 minutes'
          }
          Write-Host "Native gameplay smoke exit code: $($proc.ExitCode)"
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log -Tail 75
          }
          $report = Join-Path $evidence 'gameplay-result.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw 'Native gameplay smoke did not produce gameplay-result.json'
          }
          $json = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Get-Content -LiteralPath $report
          if ($proc.ExitCode -ne 0 -or $json.status -ne 'PASS') {
            throw "Native gameplay smoke failed (process=$($proc.ExitCode), status=$($json.status))"
          }
          # Phase 15 must exercise the real human skill entry point in the
          # actual Player. A generic PASS without per-hero evidence is invalid.
          if ($json.humanSkillSmokesExpected -ne 10 -or
              $json.humanSkillSmokesPassed -ne 10 -or
              -not $json.noHumanSkillDirectCaptures -or
              @($json.humanSkillEvidence).Count -ne 10) {
            throw "Human skill smoke missing or failed: expected=$($json.humanSkillSmokesExpected) passed=$($json.humanSkillSmokesPassed)"
          }
          $uniqueEvidence = @($json.humanSkillEvidence | Select-Object -Unique)
          if ($uniqueEvidence.Count -ne 10) {
            throw 'Duplicate human skill smoke scenarios did not cover 10 distinct casts'
          }
          foreach ($item in @($json.humanSkillEvidence)) {
            if (-not $item.Contains(':cast=true:repeatRejected=true:capture=false')) {
              throw "Human skill smoke audit fields invalid: $item"
            }
            Write-Host "HUMAN_SKILL_GPU_QA_PASS: $item"
          }

          # Phase 16: chain/target assertions are separate from Phase 15.
          if ($json.targetedSkillSmokesExpected -ne 4 -or
              $json.targetedSkillSmokesPassed -ne 4 -or
              @($json.targetedSkillEvidence).Count -ne 4) {
            throw "Targeted human skill Player QA missing: expected=$($json.targetedSkillSmokesExpected) passed=$($json.targetedSkillSmokesPassed)"
          }
          $targetedEvidence = @($json.targetedSkillEvidence)
          if (@($targetedEvidence | Select-Object -Unique).Count -ne 4) {
            throw 'Phase16 skill evidence is duplicated'
          }
          foreach ($case in @('Riven:Hider:Q1:', 'Riven:Hider:Q2:',
                              'Riven:Hider:Q3:', 'Yasuo:Hider:E:')) {
            if (@($targetedEvidence | Where-Object { $_.StartsWith($case) }).Count -ne 1) {
              throw "Phase16 missing unique Player case: $case"
            }
          }
          foreach ($item in $targetedEvidence) {
            if (-not $item.Contains(':capture=false')) {
              throw "Phase16 target/chain skill capture regression: $item"
            }
            Write-Host "TARGETED_SKILL_GPU_QA_PASS: $item"
          }

          # Phase 17A: actual pinned Map11 bush vision, not fabricated targets.
          if ($json.visionSkillSmokesExpected -ne 1 -or
              $json.visionSkillSmokesPassed -ne 1 -or
              @($json.visionSkillEvidence).Count -ne 1) {
            throw "Phase17A real Map11 vision QA missing or incomplete"
          }
          $visionCase = [string]@($json.visionSkillEvidence)[0]
          if (-not $visionCase.StartsWith('Yasuo:Hunter:E:real-map11-bush=true:') -or
              -not $visionCase.Contains(':hidden-nearest-rejected=true:') -or
              -not $visionCase.Contains(':visible-farther-dashed=true:') -or
              -not $visionCase.EndsWith(':capture=false')) {
            throw "Phase17A invalid Player vision evidence: $visionCase"
          }
          Write-Host "VISION_SKILL_GPU_QA_PASS: $visionCase"

          # Phase 17B: real Map11 source-backed camp, not synthetic monster QA.
          if ($json.neutralSkillSmokesExpected -ne 1 -or
              $json.neutralSkillSmokesPassed -ne 1 -or
              @($json.neutralSkillEvidence).Count -ne 1) {
            throw "Phase17B source-backed real neutral Player QA missing"
          }
          $neutralCase = [string]@($json.neutralSkillEvidence)[0]
          if (-not $neutralCase.StartsWith('Yasuo:Hider:E:real-source-camp=') -or
              -not $neutralCase.Contains(':dash=real-rift:target-lock=blocked:') -or
              -not $neutralCase.EndsWith(':neutral-alive=true:capture=false')) {
            throw "Phase17B invalid neutral Player evidence: $neutralCase"
          }
          Write-Host "NEUTRAL_SKILL_GPU_QA_PASS: $neutralCase"

          # Phase 18A: do not pass only from the gameplay PASS. Require
          # real skinned original geometry, source-idle animation and a
          # D3D11 PNG captured while the mesh intersects the camera frustum.
          if ($json.originalNeutralModelsExpected -ne 1 -or
              $json.originalNeutralModelsLoaded -ne 1 -or
              $json.originalBlueMeshVertices -le 0 -or
              -not $json.originalBlueIdlePlaying -or
              -not $json.originalBlueVisualSnapshotCaptured) {
            throw 'Phase18A original blue neutral mesh, idle or screenshot GPU QA missing'
          }
          $blueImage = Join-Path $evidence 'original-neutral-blue-gpu.png'
          if (-not (Test-Path -LiteralPath $blueImage -PathType Leaf)) {
            throw 'Phase18A real GPU screenshot absent'
          }
          [byte[]]$png = [System.IO.File]::ReadAllBytes($blueImage)
          if ($png.Length -lt 10240 -or
              ($png[0..7] -join ',') -ne '137,80,78,71,13,10,26,10') {
            throw 'Phase18A invalid or truncated real GPU PNG'
          }
          Write-Host "ORIGINAL_NEUTRAL_GPU_ART_PASS: originalBlueVertices=$($json.originalBlueMeshVertices) idle=true screenshotBytes=$($png.Length)"

      - name: Verify original champion rigs and capture per-hero real GPU art evidence
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $exe = Join-Path $project 'Build\Windows\HextechSeekers.exe'
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $evidence = Join-Path $root 'evidence'
          $log = Join-Path $root 'ChampionVisualQA.log'
          $args = @(
            '-force-d3d11',
            '-screen-fullscreen', '0',
            '-screen-width', '1280',
            '-screen-height', '720',
            '-logFile', ('"{0}"' -f $log),
            '-hextechChampionVisualQA',
            '-hextechEvidenceDir', ('"{0}"' -f $evidence)
          )
          Write-Host 'Checking actual GPU hero art: real mesh/idle/run/attack, or explicitly missing original source'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(240000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Original champion GPU QA timed out after 4 minutes'
          }
          Write-Host "Champion GPU art QA exit=$($proc.ExitCode)"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
          $file = Join-Path $evidence 'champion-visual-result.json'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            throw 'Champion GPU QA did not write champion-visual-result.json'
          }
          $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          Get-Content -LiteralPath $file
          if ($proc.ExitCode -ne 0 -or $report.status -ne 'CAPTURED_REQUIRES_VISUAL_REVIEW' -or
              -not $report.hardwareGpu -or -not $report.mapLoaded -or
              $report.selectableHeroes -ne 4 -or $report.originalRigCount -lt 1 -or
              $report.originalRigCount + $report.missingSourceCount -ne 4 -or
              @($report.heroes).Count -ne 4) {
            throw "Champion GPU QA failed: $($report.status) $($report.reason)"
          }
          $seen = @{}
          foreach ($hero in @($report.heroes)) {
            if ($seen.ContainsKey($hero.hero)) { throw "Duplicate hero in art audit: $($hero.hero)" }
            $seen[$hero.hero] = $true
            $expected = if ($hero.sourcePresent) { 3 } else { 1 }
            if (@($hero.images).Count -ne $expected) {
              throw "Wrong evidence count for $($hero.hero): expected $expected"
            }
            if ($hero.sourcePresent) {
              if ($hero.assetState -ne 'ORIGINAL_RIG' -or -not $hero.realSkinnedMesh -or
                  $hero.markerShown -or -not $hero.idle -or -not $hero.run -or
                  -not $hero.attack -or -not $hero.pivotInView -or
                  $hero.vertices -lt 3 -or $hero.bones -lt 1) {
                throw "Original hero rig/animation invalid: $($hero.hero)"
              }
            } elseif ($hero.assetState -ne 'SOURCE_MISSING_MARKER' -or
                      $hero.realSkinnedMesh -or -not $hero.markerShown) {
              throw "Missing original art incorrectly presented as finished: $($hero.hero)"
            }
            foreach ($name in @($hero.images)) {
              $image = Join-Path $evidence $name
              if (-not (Test-Path -LiteralPath $image -PathType Leaf)) {
                throw "Missing actual GPU champion screenshot: $name"
              }
              $bytes = [System.IO.File]::ReadAllBytes($image)
              if ($bytes.Length -lt 16384) { throw "Champion image too small: $name" }
              $signature = @(137,80,78,71,13,10,26,10)
              for ($i = 0; $i -lt $signature.Length; $i++) {
                if ($bytes[$i] -ne $signature[$i]) { throw "Champion image is not PNG: $name" }
              }
              $width = [System.Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($bytes, 16))
              $height = [System.Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($bytes, 20))
              if ($width -lt 800 -or $height -lt 450) { throw "Champion image too small: $name" }
              Write-Host "CHAMPION_GPU_EVIDENCE_OK: $name bytes=$($bytes.Length) $width x $height"
            }
          }
          foreach ($hero in @('Garen', 'Blitzcrank', 'Riven', 'Yasuo')) {
            if (-not $seen.ContainsKey($hero)) { throw "Hero absent from GPU art audit: $hero" }
          }
          Write-Host "CHAMPION_ART_GPU_VISUAL_QA_PASS: real=$($report.originalRigCount) missing=$($report.missingSourceCount)"
          Write-Host 'Original art scale, direction and aesthetics still require manual screenshot review'

      - name: Capture and verify Phase 10 combat effects on the actual GPU
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'native-unity'
          $exe = Join-Path $project 'Build\Windows\HextechSeekers.exe'
          $root = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $evidence = Join-Path $root 'evidence'
          $log = Join-Path $root 'Phase10Visual.log'
          $args = @(
            '-force-d3d11',
            '-screen-fullscreen', '0',
            '-screen-width', '1280',
            '-screen-height', '720',
            '-logFile', ('"{0}"' -f $log),
            '-hextechPhase10QA',
            '-hextechEvidenceDir', ('"{0}"' -f $evidence)
          )
          Write-Host 'Testing Phase 10 diagnostic skill FX: Blitz Q, Yasuo Q/W, Riven dash and visible-only impacts'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(240000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Phase 10 GPU screenshot smoke timed out after 4 minutes'
          }
          Write-Host "Phase 10 GPU smoke exit code: $($proc.ExitCode)"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 95 }
          $report = Join-Path $evidence 'phase10-visual-result.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw 'Phase 10 Player failed to write phase10-visual-result.json'
          }
          $json = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Write-Host (Get-Content -LiteralPath $report -Raw)
          if ($proc.ExitCode -ne 0 -or $json.status -ne 'CAPTURED_REQUIRES_VISUAL_REVIEW' -or
              -not $json.hardwareGraphics -or -not $json.mapLoaded -or
              -not $json.hiddenFxInvisible -or $json.scenarios -ne 5 -or
              $json.screenshots -ne 5) {
            throw "Phase 10 GPU test failed: status=$($json.status) reason=$($json.reason)"
          }
          $expected = @(
            'phase10-blitz-hook.png',
            'phase10-yasuo-tornado.png',
            'phase10-yasuo-windwall.png',
            'phase10-riven-dash.png',
            'phase10-visible-impact.png'
          )
          foreach ($name in $expected) {
            $file = Join-Path $evidence $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing actual GPU screenshot: $name"
            }
            $bytes = [System.IO.File]::ReadAllBytes($file)
            if ($bytes.Length -lt 16384) { throw "Phase 10 screenshot too small: $name" }
            $signature = @(137,80,78,71,13,10,26,10)
            for ($i = 0; $i -lt $signature.Length; $i++) {
              if ($bytes[$i] -ne $signature[$i]) { throw "Screenshot is not a valid PNG: $name" }
            }
            $w = [System.Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($bytes, 16))
            $h = [System.Net.IPAddress]::NetworkToHostOrder([BitConverter]::ToInt32($bytes, 20))
            if ($w -lt 800 -or $h -lt 450) { throw "Phase 10 screenshot has wrong dimensions: $name ($w x $h)" }
            Write-Host "PHASE10_EVIDENCE_OK: $name bytes=$($bytes.Length) dimensions=$w x $h"
          }
          Write-Host 'PHASE10_GPU_VISUAL_QA_PASS: 5 real PNGs, hardware GPU, per-caster fog visibility gating'
          Write-Host 'NOTE: original champion art/VFX fidelity still requires manual screenshot review'

      # Do not depend on actions/upload-artifact during job startup:
      # this self-hosted Runner intermittently times out fetching its code
      # from codeload.github.com, before Unity/Python steps can even start.
      - name: Preserve local GPU screenshots and diagnostics
        if: always()
        run: |
          $source = Join-Path $env:RUNNER_TEMP "hextech-native-gpu-$env:GITHUB_RUN_ID"
          $runnerHome = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)

          # Player builds are untracked workspace output. A later checkout in
          # the Editor workflow runs git clean -ffdx and removes native-unity/Build.
          # Keep a durable copy outside _work so the game remains playable.
          $buildSource = Join-Path $env:GITHUB_WORKSPACE 'native-unity/Build/Windows'
          $buildRoot = Join-Path $runnerHome 'HextechBuilds'
          $buildTarget = Join-Path (Join-Path $buildRoot $env:GITHUB_RUN_ID) 'Windows'
          $latestTarget = Join-Path $buildRoot 'latest'
          $exeName = 'HextechSeekers.exe'
          $summary = $env:GITHUB_STEP_SUMMARY
          if ((Test-Path -LiteralPath (Join-Path $buildSource $exeName) -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $buildSource 'HextechSeekers_Data') -PathType Container)) {
            # This versioned build is immutable and always the authoritative
            # artifact for this exact GITHUB_SHA. Never delete another running
            # Player just to update the convenience "latest" directory.
            New-Item -ItemType Directory -Force -Path $buildTarget | Out-Null
            Copy-Item -Path (Join-Path $buildSource '*') -Destination $buildTarget -Recurse -Force -ErrorAction Stop
            $buildInfo = @(
              'Hextech Seekers Windows x64 Player'
              ('GitHub run: ' + $env:GITHUB_RUN_ID)
              ('Commit: ' + $env:GITHUB_SHA)
              ('Built from: ' + $buildSource)
              ('Stable build: ' + $buildTarget)
              'Keep HextechSeekers.exe beside HextechSeekers_Data.'
            )
            Set-Content -LiteralPath (Join-Path $buildTarget 'BUILD-INFO.txt') -Value $buildInfo -Encoding UTF8
            New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
            Set-Content -LiteralPath (Join-Path $buildRoot 'LATEST-BUILD-INFO.txt') -Encoding UTF8 -Value $buildInfo

            $latestInUse = $false
            $lockProbe = Join-Path $latestTarget 'HextechSeekers_Data\Managed\mscorlib.dll'
            if (Test-Path -LiteralPath $lockProbe -PathType Leaf) {
              try {
                $stream = [System.IO.File]::Open($lockProbe,
                  [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite,
                  [System.IO.FileShare]::None)
                $stream.Dispose()
              } catch {
                $latestInUse = $true
                Write-Warning "Existing 'latest' Player in use; keeping it intact and publishing immutable $buildTarget"
              }
            }
            if (-not $latestInUse) {
              # Stage before swapping so we never expose a partly copied
              # latest build. A locked/missing target leaves the versioned
              # build accessible, without failing gameplay GPU acceptance.
              $next = Join-Path $buildRoot ("latest-pending-" + $env:GITHUB_RUN_ID)
              $previous = Join-Path $buildRoot ("latest-previous-" + $env:GITHUB_RUN_ID)
              try {
                New-Item -ItemType Directory -Force -Path $next | Out-Null
                Copy-Item -Path (Join-Path $buildTarget '*') -Destination $next -Recurse -Force -ErrorAction Stop
                if (Test-Path -LiteralPath $latestTarget) {
                  Move-Item -LiteralPath $latestTarget -Destination $previous -ErrorAction Stop
                }
                Move-Item -LiteralPath $next -Destination $latestTarget -ErrorAction Stop
                Write-Host ('PLAYER_LATEST_UPDATED=' + $latestTarget)
              } catch {
                Write-Warning "Cannot atomically refresh latest directory: $($_.Exception.Message)"
                if (-not (Test-Path -LiteralPath $latestTarget) -and
                    (Test-Path -LiteralPath $previous)) {
                  Move-Item -LiteralPath $previous -Destination $latestTarget -ErrorAction Stop
                }
              } finally {
                if (Test-Path -LiteralPath $next) {
                  Remove-Item -LiteralPath $next -Recurse -Force -ErrorAction SilentlyContinue
                }
                if (Test-Path -LiteralPath $previous) {
                  Remove-Item -LiteralPath $previous -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            }
            Write-Host ('PLAYER_BUILD_DIR=' + $buildTarget)
            Write-Host ('PLAYER_BUILD_EXE=' + (Join-Path $buildTarget $exeName))
            $buildBytes = (Get-ChildItem -LiteralPath $buildTarget -Recurse -File |
                Measure-Object -Property Length -Sum).Sum
            Write-Host ('PLAYER_BUILD_TOTAL_BYTES=' + $buildBytes)
            if ($summary) {
              Add-Content -LiteralPath $summary -Encoding UTF8 -Value @(
                '### Playable Windows build preserved outside the Git workspace'
                ''
                ('Executable: ' + (Join-Path $buildTarget $exeName))
                ('Commit: ' + $env:GITHUB_SHA)
                ('Latest may be held open by a running Player; use the run-specific copy.')
              )
            }
          } else {
            Write-Warning ('Windows Player build not found; nothing to preserve at ' + $buildSource)
          }

          $archiveRoot = Join-Path $runnerHome 'HextechVisualEvidence'
          $target = Join-Path $archiveRoot $env:GITHUB_RUN_ID
          $summary = $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            Write-Warning "No GPU evidence was generated. See the failing step logs."
            if ($summary) { Add-Content -LiteralPath $summary -Value 'No GPU evidence directory was generated.' -Encoding UTF8 }
          } else {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force -ErrorAction Stop
            $zip = Join-Path $archiveRoot ("hextech-gpu-" + $env:GITHUB_RUN_ID + ".zip")
            if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
            Compress-Archive -Path (Join-Path $target '*') -DestinationPath $zip -CompressionLevel Optimal
            Write-Host "EVIDENCE_DIR=$target"
            Write-Host "EVIDENCE_ZIP=$zip"
            Get-ChildItem -LiteralPath $target -Recurse -File | ForEach-Object {
              Write-Host ("EVIDENCE_FILE=" + $_.FullName + " BYTES=" + $_.Length)
            }
            if ($summary) {
              Add-Content -LiteralPath $summary -Encoding UTF8 -Value @(
                '### Windows GPU evidence saved on the self-hosted Runner'
                ''
                ('Run: ' + $env:GITHUB_RUN_ID)
                ('Local evidence: `' + $target + '`')
                ('Local ZIP: `' + $zip + '`')
                ''
                'The images remain local and are **not** published to a public artifact endpoint.'
                'The GPU verification step, not this archiving step, determines acceptance.'
              )
            }
          }
