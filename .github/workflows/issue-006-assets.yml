name: Build Issue 006 originals and Chromium validate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/issue-006-assets.yml'
      - 'scripts/build-issue006-champions.py'
      - 'scripts/fetch-visual-sources.py'
      - 'scripts/convert-native-champion.py'
      - 'scripts/render-visual-assets.py'
      - 'scripts/issue006-visual-check.py'
      - 'dist/rebuild/**'
      - 'tests/champion-renderer.test.mjs'
      - 'tests/live-session.test.mjs'
      - 'tests/encounter.test.mjs'
      - 'tests/match.test.mjs'
      - 'dist/assets/visual/**'
permissions:
  contents: write
concurrency:
  group: issue006-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets-and-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install EGL and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libosmesa6 libgl1-mesa-dri
          python -m pip install --break-system-packages -r scripts/visual-requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build original champion atlases (strict source verification)
        run: |
          python scripts/build-issue006-champions.py --source /tmp/issue006-source
          node --test
      - name: Check rendered assets with Chromium
        run: |
          python scripts/issue006-visual-check.py
      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue006-chromium-proof
          path: |
            artifacts/issue006/**
          if-no-files-found: warn
      - name: Commit generated original atlases only after browser check
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/implementation/issue006-visual
          cp artifacts/issue006/champion-gallery.png docs/implementation/issue006-visual/champion-gallery.png
          cp artifacts/issue006/playable-*.png docs/implementation/issue006-visual/
          cp artifacts/issue006/chromium-game.png docs/implementation/issue006-visual/chromium-game.png
          cp artifacts/issue006/chromium-game-preview.jpg docs/implementation/issue006-visual/chromium-game-preview.jpg
          cp artifacts/issue006/browser-check.json docs/implementation/issue006-visual/browser-check.json
          cp artifacts/issue006/attack-check.json docs/implementation/issue006-visual/attack-check.json
          cp artifacts/issue006/atlas-check.json docs/implementation/issue006-visual/atlas-check.json
          git restore --worktree dist/assets/native
          git add dist/assets/visual/garen/sprite.json dist/assets/visual/blitzcrank dist/assets/visual/riven dist/assets/visual/yasuo docs/implementation/issue006-visual
          git diff --cached --quiet && exit 0
          git commit -m "assets: verify four original champions in Chromium (Issue 006)"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
